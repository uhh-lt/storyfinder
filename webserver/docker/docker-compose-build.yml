version: '2.1'

networks:
  sf-net:

services:
  mysqlserver:
    image: "mysql:5.5"
    ports: 
      - "3306:3306"
    environment:
      - MYSQL_RANDOM_ROOT_PASSWORD=yes
      - MYSQL_DATABASE=storyfinder
      - MYSQL_USER=storyfinder
      - MYSQL_PORT=3306
      - MYSQL_PASSWORD=storyfinder
    volumes:
      - ${PWD}/mysql-data:/var/lib/mysql
    command: ["--character-set-server=utf8", "--collation-server=utf8_bin"]
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost", "-pstoryfinder", "-ustoryfinder"]
      interval: 20s
      timeout: 10s
      retries: 3
    networks:
      sf-net:
        aliases:
          - mysql

  webserver:
    build:
      context: ..           # geht eine Ebene hoch ins Webserver-Verzeichnis
      dockerfile: Dockerfile  # liegt im Webserver-Stamm
    depends_on:
      mysqlserver:
        condition: service_healthy
    ports:
      - "3055:3055"          # expose Port aus eurem launch.json
    environment:
      - NODE_ENV=production
      - COOKIE_SECRET=1337
      - MYSQL_HOST=mysql      # nutzt den Alias aus networks/mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=storyfinder
      - MYSQL_PASSWORD=storyfinder
      - MYSQL_DATABASE=storyfinder
      - CORENLP_HOST=host.docker.internal   # leitet auf euren lokal laufenden NLP-Server weiter
      - NER=corenlp
      - NO_KEYWORDS=T
    restart: unless-stopped
    networks:
      sf-net: