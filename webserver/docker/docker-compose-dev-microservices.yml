##
# storyfinder build compose, consistas of webserver, mysql, nlpservers
##
version: '2.1'

networks:
  sf-net:

services:
  mysqlserver:
    image: "mysql:5.5"
    ports: 
      - "3306:3306"
    environment:
      - MYSQL_RANDOM_ROOT_PASSWORD=yes
      - MYSQL_DATABASE=storyfinder
      - MYSQL_USER=storyfinder
      - MYSQL_PORT=3306
      - MYSQL_PASSWORD=storyfinder
    volumes:
      - ${PWD}/mysql-data:/var/lib/mysql
    command: ["--character-set-server=utf8", "--collation-server=utf8_bin"]
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost", "-pstoryfinder", "-ustoryfinder"]
      interval: 20s
      timeout: 10s
      retries: 3
    networks:
      sf-net:
        aliases:
          - mysql


  preprocess:
    build:
      context: ../../nlpserver/Preprocess
      dockerfile: Dockerfile.preprocess
    ports:
      - "9000:9000"
    networks: [sf-net]

  ner:
    build:
      context: ../../nlpserver/NER
      dockerfile: Dockerfile.ner
    ports:
    - "9001:9001"
    networks: [sf-net]

  relations:
    build:
      context: ../../nlpserver/Relations
      dockerfile: Dockerfile.relations
    ports:
      - "9002:9002"
    networks: [sf-net]


  summary:
    build:
      context: ../../nlpserver
      dockerfile: Dockerfile.summary
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9003/health"]
      interval: 20s
      timeout: 10s
      retries: 3
    expose: 
      - "9003"
    restart: unless-stopped
    networks: 
      - sf-net


  chat:
    build:
      context: ../../nlpserver
      dockerfile: Dockerfile.chat
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9004/health"]
      interval: 20s
      timeout: 10s
      retries: 3
    expose:
      - "9004"
    restart: unless-stopped
    networks: 
      - sf-net


