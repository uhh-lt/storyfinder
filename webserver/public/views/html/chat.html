<div class="card chat-card">
  <div id="sf-chat-header" class="chat-header">
    <div id="sf-header-left" class="chat-header-left">
      <h1>Chat</h1>
      <span id="sf-session-pill" class="helper" title="Current session">—</span>
      <span id="sf-context-pill" class="helper">Context: current</span>
    </div>
    <div id="sf-header-actions"></div>
  </div>

  <div id="sf-chat-main">
    <div id="sf-chat-list"></div>
  </div>

  <div id="sf-chat-composer">
    <div class="chat-composer-grid">
      <div id="sf-chat-templates"></div>
      <textarea id="sf-chat-input" rows="3" placeholder="Ask your question…"></textarea>
      <div class="sf-composer-row">
        <span id="sf-chat-status" class="helper" aria-live="polite"></span>
        <button class="btn" id="sf-chat-send">Send</button>
      </div>
    </div>
  </div>
</div>
